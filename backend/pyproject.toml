[project]
name = "ayevideodownloader-backend"
version = "1.0.0"
description = "FastAPI backend for AyeVideoDownloader"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "app/tests",
]
